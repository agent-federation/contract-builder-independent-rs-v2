[package]
name = "pap-verifier"
version = "0.1.0-alpha.3"
edition = "2021"
description = "Independent Phase 2a verifier for Portable Assurance Package (PAP) v0.1"
readme = "README.md"
license = "MIT"
repository = "https://github.com/agent-federation/contract-builder-independent-rs-v2"
keywords = ["pap", "assurance", "verification", "phase2a"]
categories = ["development-tools", "parsing"]
exclude = ["pap/fixtures", "pap/schemas", "snapshot", "docs", "AGENT_BRIEF.md", "RELEASE.md", ".gitignore", "scripts", "tests"]

[lib]
name = "pap"
path = "src/lib.rs"

[[bin]]
name = "pap"
path = "src/main.rs"

[dependencies]
# Intentionally empty: pure Rust std implementation. The nested dependency
# closure of the checker identity is therefore empty by construction.

[profile.release]
# Reproducible-friendly release profile (content digests only, no env data).
